[translation]
; Name of the JSON file, inside this "_translation" folder, containing the
; text translations. Change this to switch language files, e.g.:
;   file=translation_de.json
;   file=translation_fr.json
file=translation.json
; Use common terms from commonTerms.json in addition to the selected translation file.
; 0 = disabled, 1 = enabled. When enabled, common terms override identical keys.
use_common_terms=0
; Some games use non-standard text fields. You can enter names of these fields here and translator will translate them.
; Caution - Some fields contain file paths, if they are added paths will be translated, causing file errors.
extra_text_keys=

[text_scaling]
; Adjusts font size to help translated text fit, without changing the
; game's configured font. Off by default.
; 0 = off
; 1 = restricted to the message box, name box, and choice/selection box
; 2 = global (every window, including menus/status screens)
scaling_mode=0
; Percentage. 100 = default/unscaled size. If this stays at 100, scaling
; is treated as disabled no matter what scaling_mode above is set to.
scaling_percent=100

[word_wrap]
; Wraps long lines in the message box only, without breaking words apart.
; Off by default. 0 = off, 1 = on.
word_wrap=0
